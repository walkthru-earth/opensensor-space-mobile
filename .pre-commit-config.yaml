# Git hooks, versioned. One-time setup per clone:  tools/setup-hooks.sh   (needs `pre-commit`:
# brew install pre-commit / pipx install pre-commit). Then every commit runs the fast checks below
# and every push runs the full `./gradlew verify` gate that AGENTS.md requires before a commit.
#
# pre-commit stage (seconds): whitespace/EOL hygiene, YAML/JSON/TOML syntax, no large or secret files,
#   secret scan (gitleaks — the LAN token and Wi-Fi PSK must never land in the repo), ktlint format+lint
#   on the staged Kotlin files with the rules in .editorconfig.
# pre-push stage (minutes): `./gradlew verify` = lintDebug + assembleDebug + every module's host tests,
#   and on a Mac also `verifyIos` (every shared module's iOS simulator tests and the framework link).
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^core/model/bundled/templates/   # firmware bytes, the SHA-256 is the template desc
      - id: end-of-file-fixer
        exclude: ^(core/database/schemas/|core/parquet/src/test/resources/(parquet|geoparquet)/expected\.json$|core/model/bundled/templates/)   # generated by Room / make_*_fixtures.py / opensensor-space-firmware
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^(gradlew\.bat$|core/model/bundled/templates/)
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=600]       # parquet fixtures are ≤ 450 KB; a stray APK or SD dump is not
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [manual]          # opt in with `pre-commit run no-commit-to-branch --hook-stage manual`

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ktlint
        name: ktlint (format + lint, .editorconfig rules)
        entry: tools/hooks/ktlint.sh
        language: script
        types_or: [kotlin]
        files: \.(kt|kts)$
        exclude: ^(.*/build/|.*/bin/)
        require_serial: true

      - id: gradle-verify
        name: ./gradlew verify (lint + build + host tests, plus iOS tests on a Mac)
        entry: ./gradlew --no-daemon -q verify
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
