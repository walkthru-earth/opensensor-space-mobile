# Project-wide Gradle settings. IDE settings override this file.
# https://docs.gradle.org/current/userguide/build_environment.html

# Gradle daemon heap. Kotlin/Native linking of the iOS framework and R8 on the release APK both
# need more than the 2 GB default.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Kotlin compile daemon heap, separate from the Gradle daemon.
kotlin.daemon.jvmargs=-Xmx3g

# AndroidX package structure.
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official

# Each library's R class holds only its own resources.
android.nonTransitiveRClass=true

# Build speed. The configuration cache is stable since Gradle 8.1 and problems fail the build,
# so a new incompatible plugin or build script read is caught at once.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

# Dependency downloads retry on 408, 429 (Maven Central rate limits) and 5xx, five attempts with a
# doubling pause from 5 s, so a rate limit does not fail verify, verifyIos or the release. These are
# Gradle internal properties, checked on Gradle 9.8.2. Recheck them when the wrapper moves. The
# network.retry pair is read by NetworkOperationBackOffAndRetry (NetworkingIssueVerifier picks the
# transient codes), the repository pair by ErrorHandlingModuleComponentRepository. Both pairs default
# to 3 attempts from 1 s.
systemProp.org.gradle.internal.network.retry.max.attempts=5
systemProp.org.gradle.internal.network.retry.initial.backOff=5000
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=5000

# Shares cinterop bindings (the H3 C library of :core:publicfeed) with the iosMain, appleMain and
# nativeMain source sets, so their metadata compiles resolve the bindings the platform compiles see.
kotlin.mpp.enableCInteropCommonization=true
