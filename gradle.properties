# Project-wide Gradle settings. IDE settings override this file.
# https://docs.gradle.org/current/userguide/build_environment.html

# Gradle daemon heap. Kotlin/Native linking of the iOS framework and R8 on the release APK both
# need more than the 2 GB default.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Kotlin compile daemon heap, separate from the Gradle daemon.
kotlin.daemon.jvmargs=-Xmx3g

# AndroidX package structure.
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official

# Each library's R class holds only its own resources.
android.nonTransitiveRClass=true

# Build speed. The configuration cache is stable since Gradle 8.1 and problems fail the build,
# so a new incompatible plugin or build script read is caught at once.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
