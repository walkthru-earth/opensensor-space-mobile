# The cache key of ~/.konan, the Kotlin/Native compiler, its dependencies and its compiler caches.
# The compiler changes with the Kotlin version. On a Mac ~/.konan also holds the compiler cache of
# every library an iOS binary links (klib/cache/*-user-pl), and a library bump needs new ones. So the
# macOS key also holds the Xcode version and a hash of gradle/libs.versions.toml. A catalog change
# then saves a new entry on main instead of hitting the old key and rebuilding those caches on every
# later run (docs/build-and-release.md, CI caches). Linux links no iOS binary, so its key holds only
# the Kotlin version. Reads `kotlin` from gradle/libs.versions.toml and fails with an annotation on
# that file when it is missing or repeated.
name: Kotlin/Native cache key
description: Outputs the ~/.konan cache key and its restore keys for this runner, Kotlin, Xcode and libraries.
inputs:
  xcode:
    description: The Xcode version of a macOS job. Leave empty on Linux.
    required: false
    default: ""
outputs:
  kotlin:
    description: The Kotlin version, for example 2.4.21.
    value: ${{ steps.read.outputs.kotlin }}
  key:
    description: The exact cache key.
    value: ${{ steps.read.outputs.key }}
  restore-keys:
    description: >-
      Key prefixes, one per line, newest match first. A library, Kotlin or Xcode bump starts from the
      newest entry of the same Xcode, then from the newest entry of this runner.
    value: ${{ steps.read.outputs.restore-keys }}
runs:
  using: composite
  steps:
    - id: read
      shell: bash
      env:
        XCODE: ${{ inputs.xcode }}
      run: |
        set -euo pipefail
        file=gradle/libs.versions.toml
        values="$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' "$file" 2>/dev/null || true)"
        if [[ ! "$values" =~ ^[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.-]*$ ]]; then
          echo "::error file=$file::kotlin must appear exactly once in [versions], found '${values//$'\n'/,}'"
          exit 1
        fi
        runner="konan-$RUNNER_OS-$RUNNER_ARCH-"
        if [[ -n "$XCODE" ]]; then
          prefix="${runner}xcode-$XCODE-"
          libraries="$(shasum -a 256 "$file" | cut -c1-16)"
          key="${prefix}kotlin-$values-libs-$libraries"
          restore="$prefix"$'\n'"$runner"
        else
          key="${runner}kotlin-$values"
          restore="$runner"
        fi
        {
          echo "kotlin=$values"
          echo "key=$key"
          echo "restore-keys<<KONAN_RESTORE_KEYS"
          echo "$restore"
          echo "KONAN_RESTORE_KEYS"
        } >> "$GITHUB_OUTPUT"
