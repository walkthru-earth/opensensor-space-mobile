# APKs anyone can install, without a store.
#
# - Every push to `main` refreshes ONE rolling pre-release tagged `latest` (tag moved to the commit,
#   assets replaced after upload), so the newest build is at .../releases/tag/latest.
# - A `v*` tag (e.g. `v1.2.0`) publishes a proper, permanent release with the same assets.
#
# One universal APK includes every ABI supplied by zstd-jni. Room uses the platform's SQLite;
# the Parquet reader is pure Kotlin and delegates ZSTD decompression to that bundled library.
# `minSdk 31` → Android 12 and newer, phones and tablets.
#
# Signing is fail-closed: four keystore secrets plus RELEASE_CERT_SHA256 are mandatory.
# The keystore/certificate are validated before Gradle; the APK signer is checked before publication.
#   KEYSTORE_BASE64  = base64 of the .jks   ·   KEYSTORE_PASSWORD · KEY_ALIAS · KEY_PASSWORD
#
# Least privilege. The `apk` job builds and signs with a read-only token and a read-only Gradle
# cache, then hands dist/ to the `publish` job, the only one allowed to write tags and releases.
# The release APK is minified by R8, so mapping.txt is required and published for retrace.
# Actions are pinned to commit SHAs (version in the trailing comment). Dependabot updates them.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      tag: ${{ steps.meta.outputs.tag }}
      version_name: ${{ steps.meta.outputs.version_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for the commit list in the release notes

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Release builds only read the cache that verify.yml writes on main, so a release
          # can neither be influenced by nor poison a cache entry of its own.
          cache-read-only: true

      - name: Cache Kotlin Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'core/*/build.gradle.kts', 'ios/shared/build.gradle.kts') }}

      - name: Work out version and channel
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            {
              echo "channel=tag"
              echo "tag=${GITHUB_REF_NAME}"
              echo "version_name=${GITHUB_REF_NAME#v}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "channel=rolling"
              echo "tag=latest"
              echo "version_name=0.0.${GITHUB_RUN_NUMBER}-$(git rev-parse --short=8 HEAD)"
            } >> "$GITHUB_OUTPUT"
          fi
          # Monotonic across both channels: the run number only grows.
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Restore and validate release signing configuration
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required release signing secret $name is missing or blank"
              exit 1
            fi
          done
          keystore="${RUNNER_TEMP}/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" >/dev/null
          actual=$(keytool -exportcert -rfc -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -outform DER |
            sha256sum |
            awk '{print toupper($1)}')
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:-' | tr '[:lower:]' '[:upper:]')
          if [ "$actual" != "$expected" ]; then
            echo "::error::Release certificate SHA-256 does not match RELEASE_CERT_SHA256"
            exit 1
          fi
          echo "file=$keystore" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$actual" >> "$GITHUB_OUTPUT"

      - name: Run the full verification suite and build the release APK
        env:
          AQSYNC_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          AQSYNC_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          AQSYNC_KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          AQSYNC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AQSYNC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AQSYNC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 tools/validate_station_epoch_migration.py
          python3 tools/validate_sensor_installation_migration.py
          ./gradlew --no-daemon verify :app:assembleRelease

      - name: Verify the built APK signer
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ steps.keystore.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$build_tools"
          "$build_tools/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee "${RUNNER_TEMP}/apksigner.txt"
          # New build-tools label scheme-specific certificates as "V2 Signer:";
          # earlier versions use "Signer #1". Accept only explicit certificate digests,
          # exactly one signer, and one unique SHA-256 fingerprint across schemes.
          signers=$(sed -n 's/^Number of signers: //p' "${RUNNER_TEMP}/apksigner.txt")
          actual=$(sed -nE 's/^(Signer #[0-9]+|V[0-9.]+ Signer:)[[:space:]]+certificate SHA-256 digest: ([[:xdigit:]]{64})[[:space:]]*$/\2/p' "${RUNNER_TEMP}/apksigner.txt" | tr '[:lower:]' '[:upper:]' | sort -u)
          if [ "$signers" != "1" ] || ! [[ "$actual" =~ ^[0-9A-F]{64}$ ]] || [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Built APK signer does not match the validated release certificate"
            exit 1
          fi

      - name: Name and checksum the artifacts
        id: files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/opensensor-space-${{ steps.meta.outputs.version_name }}-universal.apk"
          # R8 is on for release, so a missing mapping means the build is not what we expect.
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${{ steps.meta.outputs.version_name }}.txt"
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          ls -l dist

      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "**opensensor.space** \`${{ steps.meta.outputs.version_name }}\` · versionCode ${{ steps.meta.outputs.version_code }} · commit ${GITHUB_SHA::8}"
            echo
            echo "Signed with the validated project release certificate (SHA-256 \`${{ steps.keystore.outputs.cert_sha256 }}\`)."
            echo "Universal APK for Android 12+ (minSdk 31), including the bundled ZSTD native ABIs."
            echo "Code is minified by R8. Use the attached mapping file to retrace stack traces."
            echo
            if [ "${{ steps.meta.outputs.channel }}" = "rolling" ]; then
              echo "_Rolling build: this release is replaced on every push to \`main\`._"
              echo
            fi
            echo "### iOS"
            echo "The iOS app shares the protocol and sensor rules with Android. It shows Bluetooth live readings, finds sensors with Bonjour, collects verified archives from several sensors over authenticated Wi-Fi, and exports Parquet files through the Files app."
            echo "Host, simulator and build checks cover these features. Qualification on a real iPhone (Wi-Fi collection, background recovery and export) is still pending, so treat iOS as a preview."
            echo "Xcode 27 validation builds an unsigned ARM64 simulator app and checks the device Release build."
            echo "Download the simulator app ZIP from a successful [verify workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/verify.yml) for this commit. It runs in Xcode's iOS Simulator; it cannot be installed on an iPhone."
            echo "Signed iPhone/TestFlight distribution is not available yet. See the [iOS build and release guide](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/build-and-release.md#later-ios-release-start-with-testflight)."
            echo
            echo "### Changes"
            prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
            if [ -n "$prev" ]; then git log --format='- %s (%h)' "$prev..HEAD" | head -50; else git log --format='- %s (%h)' -n 20; fi
          } > dist/NOTES.md

      - name: Keep the APK as a workflow artifact too
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opensensor-space-${{ steps.meta.outputs.version_name }}
          path: dist/
          retention-days: 14   # the organisation maximum

  publish:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tags and releases, nothing else
    steps:
      - name: Fetch the verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opensensor-space-${{ needs.apk.outputs.version_name }}
          path: dist

      - name: Move the rolling tag to the verified commit
        if: needs.apk.outputs.channel == 'rolling'
        id: rolling
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repo = context.repo;
            // Older queued builds must not replace latest or tag a commit whose workflows
            // differ from current main (GITHUB_TOKEN cannot gain workflows permission).
            const head = await github.rest.git.getRef({ ...repo, ref: 'heads/main' });
            if (head.data.object.sha !== context.sha) {
              core.notice('Skipping rolling publication: main has advanced beyond this build. The APK is retained as a workflow artifact.');
              core.setOutput('publish', 'false');
              return;
            }
            let latest;
            try {
              latest = await github.rest.git.getRef({ ...repo, ref: 'tags/latest' });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!latest) {
              await github.rest.git.createRef({ ...repo, ref: 'refs/tags/latest', sha: context.sha });
            } else if (latest.data.object.sha !== context.sha) {
              await github.rest.git.updateRef({ ...repo, ref: 'tags/latest', sha: context.sha, force: true });
            }
            const updated = await github.rest.git.getRef({ ...repo, ref: 'tags/latest' });
            if (updated.data.object.sha !== context.sha) {
              throw new Error('Rolling tag does not point to the verified commit');
            }
            core.setOutput('publish', 'true');

      - name: Publish (create or replace)
        if: needs.apk.outputs.channel == 'tag' || steps.rolling.outputs.publish == 'true'
        id: publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.apk.outputs.channel == 'rolling' && 'Latest Android build (rolling)' || format('opensensor.space Android {0}', needs.apk.outputs.version_name) }}
          prerelease: ${{ needs.apk.outputs.channel == 'rolling' }}
          make_latest: ${{ needs.apk.outputs.channel == 'tag' }}
          body_path: dist/NOTES.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/mapping-*.txt
          fail_on_unmatched_files: false
          overwrite_files: true

      - name: Remove previous rolling build assets after successful upload
        if: needs.apk.outputs.channel == 'rolling' && steps.rolling.outputs.publish == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ steps.publish.outputs.id }}
        with:
          script: |
            const fs = require('node:fs');
            const currentFiles = new Set(fs.readdirSync('dist'));
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: Number(process.env.RELEASE_ID), per_page: 100,
            });
            for (const asset of assets) {
              const generated = /^opensensor-space-.*-universal\.apk$/.test(asset.name) || /^mapping-.*\.txt$/.test(asset.name);
              if (generated && !currentFiles.has(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: asset.id });
              }
            }
