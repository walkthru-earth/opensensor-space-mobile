# APKs anyone can install, without a store.
#
# - Every push to `main` refreshes ONE rolling pre-release tagged `latest` (tag moved to the commit,
#   assets replaced), so the newest build is always at .../releases/tag/latest.
# - A `v*` tag (e.g. `v1.2.0`) publishes a proper, permanent release with the same assets.
#
# One universal APK includes every ABI supplied by zstd-jni. Room uses the platform's SQLite;
# the Parquet reader is pure Kotlin and delegates ZSTD decompression to that bundled library.
# `minSdk 31` → Android 12 and newer, phones and tablets.
#
# Signing is fail-closed: four keystore secrets plus RELEASE_CERT_SHA256 are mandatory.
# The keystore/certificate are validated before Gradle; the APK signer is checked before publication.
#   KEYSTORE_BASE64  = base64 of the .jks   ·   KEYSTORE_PASSWORD · KEY_ALIAS · KEY_PASSWORD
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for the commit list in the release notes

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Work out version and channel
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            {
              echo "channel=tag"
              echo "tag=${GITHUB_REF_NAME}"
              echo "version_name=${GITHUB_REF_NAME#v}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "channel=rolling"
              echo "tag=latest"
              echo "version_name=0.0.${GITHUB_RUN_NUMBER}-$(git rev-parse --short=8 HEAD)"
            } >> "$GITHUB_OUTPUT"
          fi
          # Monotonic across both channels: the run number only grows.
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Restore and validate release signing configuration
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required release signing secret $name is missing or blank"
              exit 1
            fi
          done
          keystore="${RUNNER_TEMP}/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" >/dev/null
          actual=$(keytool -exportcert -rfc -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            openssl x509 -outform DER |
            sha256sum |
            awk '{print toupper($1)}')
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:-' | tr '[:lower:]' '[:upper:]')
          if [ "$actual" != "$expected" ]; then
            echo "::error::Release certificate SHA-256 does not match RELEASE_CERT_SHA256"
            exit 1
          fi
          echo "file=$keystore" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$actual" >> "$GITHUB_OUTPUT"

      - name: Run the full verification suite and build the release APK
        env:
          AQSYNC_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          AQSYNC_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          AQSYNC_KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          AQSYNC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AQSYNC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AQSYNC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 tools/validate_station_epoch_migration.py
          ./gradlew --no-daemon verify :app:assembleRelease

      - name: Verify the built APK signer
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ steps.keystore.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$build_tools"
          "$build_tools/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee "${RUNNER_TEMP}/apksigner.txt"
          # New build-tools label scheme-specific certificates as "V2 Signer:";
          # earlier versions use "Signer #1". Accept only explicit certificate digests,
          # exactly one signer, and one unique SHA-256 fingerprint across schemes.
          signers=$(sed -n 's/^Number of signers: //p' "${RUNNER_TEMP}/apksigner.txt")
          actual=$(sed -nE 's/^(Signer #[0-9]+|V[0-9.]+ Signer:)[[:space:]]+certificate SHA-256 digest: ([[:xdigit:]]{64})[[:space:]]*$/\2/p' "${RUNNER_TEMP}/apksigner.txt" | tr '[:lower:]' '[:upper:]' | sort -u)
          if [ "$signers" != "1" ] || ! [[ "$actual" =~ ^[0-9A-F]{64}$ ]] || [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Built APK signer does not match the validated release certificate"
            exit 1
          fi

      - name: Name and checksum the artifacts
        id: files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/opensensor-space-${{ steps.meta.outputs.version_name }}-universal.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${{ steps.meta.outputs.version_name }}.txt" 2>/dev/null || true
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          ls -l dist

      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "**opensensor.space** \`${{ steps.meta.outputs.version_name }}\` · versionCode ${{ steps.meta.outputs.version_code }} · commit ${GITHUB_SHA::8}"
            echo
            echo "Signed with the validated project release certificate (SHA-256 \`${{ steps.keystore.outputs.cert_sha256 }}\`)."
            echo "Universal APK — Android 12+ (minSdk 31), including the bundled ZSTD native ABIs."
            echo
            if [ "${{ steps.meta.outputs.channel }}" = "rolling" ]; then
              echo "_Rolling build: this release is replaced on every push to \`main\`._"
              echo
            fi
            echo "### Changes"
            prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
            if [ -n "$prev" ]; then git log --format='- %s (%h)' "$prev..HEAD" | head -50; else git log --format='- %s (%h)' -n 20; fi
          } > dist/NOTES.md

      - name: Move the rolling tag to this commit
        if: steps.meta.outputs.channel == 'rolling'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Delete the previous rolling release so the new one is created cleanly at this commit.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

      - name: Publish (create or replace)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.channel == 'rolling' && 'Latest build (rolling)' || format('opensensor.space {0}', steps.meta.outputs.version_name) }}
          prerelease: ${{ steps.meta.outputs.channel == 'rolling' }}
          make_latest: ${{ steps.meta.outputs.channel == 'tag' }}
          body_path: dist/NOTES.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/mapping-*.txt
          fail_on_unmatched_files: false

      - name: Keep the APK as a workflow artifact too
        uses: actions/upload-artifact@v7
        with:
          name: opensensor-space-${{ steps.meta.outputs.version_name }}
          path: dist/
          retention-days: 14   # the organisation maximum
