# The gate from AGENTS.md, enforced: `./gradlew verify` = :app lintDebug + assembleDebug +
# testDebugUnitTest + every :core module's tests, plus the same pre-commit hooks a developer runs.
# iOS adds shared Kotlin simulator tests and unsigned simulator/device builds on Apple Silicon.
# Real BLE, mDNS, permissions and background behavior still need dated phone evidence.
# Actions are pinned to commit SHAs (version in the trailing comment). Dependabot updates them.
name: verify

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: pre-commit hooks (format, lint, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pipx run pre-commit run --all-files --show-diff-on-failure

  gradle:
    name: ./gradlew verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Cache Kotlin Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'core/*/build.gradle.kts', 'ios/shared/build.gradle.kts') }}
      - name: Validate station epoch migration
        run: python3 tools/validate_station_epoch_migration.py
      - name: Validate sensor installation migration
        run: python3 tools/validate_sensor_installation_migration.py
      - run: ./gradlew --no-daemon verify
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opensensor-space-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
            core/*/build/reports/tests/
            ios/shared/build/reports/tests/jvmTest/
          retention-days: 14
          if-no-files-found: ignore

  ios:
    name: iOS native validation
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # Project policy: validate with Xcode 27; do not inherit a moving/beta default.
      XCODE_VERSION: "27.0"
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      # Standard macOS runners have 7 GB RAM; bound concurrent native compilation.
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Cache Kotlin Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'core/*/build.gradle.kts', 'ios/shared/build.gradle.kts') }}
      - name: Check Apple toolchain
        run: |
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          mkdir -p ios/build/ci
          {
            xcodebuild -version
            xcodebuild -showsdks
            xcrun simctl list runtimes
            java -version
          } 2>&1 | tee ios/build/ci/toolchain.log
      - name: Run native archive and transfer checks
        run: ios/tests/verify-native.sh 2>&1 | tee ios/build/ci/native-tests.log
      - name: Run shared Kotlin tests on iOS simulator
        run: ./gradlew --no-daemon --stacktrace verifyIos 2>&1 | tee ios/build/ci/kotlin-tests.log
      - name: Build unsigned simulator app
        run: |
          xcodebuild -project ios/OpenSensor.xcodeproj -scheme OpenSensor \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/DerivedData-simulator \
            -resultBundlePath ios/build/ci/simulator.xcresult \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios/build/ci/simulator-build.log
      - name: Run Swift Testing target on simulator
        run: |
          device="$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone")))')"
          xcodebuild -project ios/OpenSensor.xcodeproj -scheme OpenSensor \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath ios/build/DerivedData-test \
            -resultBundlePath ios/build/ci/swift-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ios/build/ci/swift-tests.log
      - name: Build unsigned device Release app
        run: |
          xcodebuild -project ios/OpenSensor.xcodeproj -scheme OpenSensor \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/DerivedData-device \
            -resultBundlePath ios/build/ci/device-release.xcresult \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios/build/ci/device-release-build.log
      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            ios/build/DerivedData-simulator/Build/Products/Debug-iphonesimulator/OpenSensor.app \
            ios/build/ci/OpenSensor-simulator.zip
      - name: Upload simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opensensor-space-ios-simulator-xcode-${{ env.XCODE_VERSION }}-${{ github.sha }}
          path: ios/build/ci/OpenSensor-simulator.zip
          retention-days: 14
          if-no-files-found: error
      - name: Package Xcode result bundles
        if: always()
        run: |
          for bundle in ios/build/ci/*.xcresult; do
            if [ -d "$bundle" ]; then
              ditto -c -k --sequesterRsrc --keepParent "$bundle" "$bundle.zip"
            fi
          done
      - name: Upload iOS logs and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-reports-xcode-${{ env.XCODE_VERSION }}-${{ github.sha }}
          path: |
            ios/build/ci/*.log
            ios/build/ci/*.xcresult.zip
            core/protocol/build/reports/tests/iosSimulatorArm64Test/
            core/protocol/build/test-results/iosSimulatorArm64Test/
            core/history/build/reports/tests/iosSimulatorArm64Test/
            core/history/build/test-results/iosSimulatorArm64Test/
            ios/shared/build/reports/tests/iosSimulatorArm64Test/
            ios/shared/build/test-results/iosSimulatorArm64Test/
          retention-days: 14
          if-no-files-found: ignore
