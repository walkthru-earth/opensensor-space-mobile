# The gate from AGENTS.md, enforced: `./gradlew verify` = :app lintDebug + assembleDebug +
# testDebugUnitTest + every :core module's tests, plus the same pre-commit hooks a developer runs.
# What CI does NOT run: anything that needs a phone or an emulator (BLE, mDNS, the foreground
# service, WorkManager plumbing) — those results live in the firmware repo's bench-verified.md.
name: verify

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: pre-commit hooks (format, lint, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pipx run pre-commit run --all-files --show-diff-on-failure

  gradle:
    name: ./gradlew verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Validate station epoch migration
        run: python3 tools/validate_station_epoch_migration.py
      - run: ./gradlew --no-daemon verify
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: opensensor-space-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
            core/*/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore
